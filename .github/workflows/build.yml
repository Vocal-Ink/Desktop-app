name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    # Docs-only pushes don't rebuild (and don't cancel a build in progress).
    paths-ignore: ["**.md", "docs/**", ".gitignore", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"
  QT_MODULES: "qtmultimedia qtspeech qtwebsockets"
  BUILD_TYPE: Release

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsecret-1-dev libx11-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libspeechd2 libpulse0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 gstreamer1.0-plugins-base \
            espeak-ng xvfb fuse libfuse2 libgl1-mesa-dri libegl1

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Cache speech model for the round-trip test
        uses: actions/cache@v4
        with:
          path: ci-models
          key: whisper-ggml-tiny.en-v1

      - name: Download speech model
        run: |
          mkdir -p ci-models
          [ -f ci-models/ggml-tiny.en.bin ] || curl -fsSL -o ci-models/ggml-tiny.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin

      - name: Test
        env:
          VOCALINK_WHISPER_MODEL: ${{ github.workspace }}/ci-models/ggml-tiny.en.bin
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke test (launch and screenshot)
        run: |
          mkdir -p screenshots
          run() { xvfb-run -a -s "-screen 0 1400x900x24" build/src/VocalInk "$@"; }
          run --screenshot screenshots/linux-onboarding.png
          run --no-onboarding --show talk --demo --screenshot screenshots/linux-talk.png
          run --no-onboarding --show voices --screenshot screenshots/linux-voices.png
          run --no-onboarding --show audio --screenshot screenshots/linux-audio.png
          run --no-onboarding --show settings:appearance --screenshot screenshots/linux-settings.png

      - name: Package AppImage
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)
          packaging/linux/build-appimage.sh build "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: VocalInk-linux
          path: dist/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: ignore

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke test (launch and screenshot)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          # No GPU on the runner: draw Qt Quick in software for the screenshot.
          QT_QUICK_BACKEND: software
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $p = Start-Process -FilePath build\src\VocalInk.exe -ArgumentList "--screenshot","screenshots\windows-main.png" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "VocalInk exited with $($p.ExitCode)" }

      - name: Package (installer + portable zip)
        shell: pwsh
        env:
          # Optional: a zip of the Microsoft-signed virtual mic driver (docs/VIRTUAL_AUDIO.md).
          # Without it (and without packaging/windows/driver/) the build ships without the driver.
          VOCALINK_DRIVER_PACKAGE_URL: ${{ vars.VOCALINK_DRIVER_PACKAGE_URL }}
          VOCALINK_DRIVER_PACKAGE_SHA256: ${{ vars.VOCALINK_DRIVER_PACKAGE_SHA256 }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)').Matches[0].Groups[1].Value
          ./packaging/windows/deploy.ps1 -BuildDir build -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: VocalInk-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Smoke test (launch and screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p screenshots
          build/src/VocalInk.app/Contents/MacOS/VocalInk --screenshot screenshots/macos-${{ matrix.arch }}-main.png

      - name: Package dmg
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n1)
          packaging/macos/build-dmg.sh build "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: VocalInk-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos-${{ matrix.arch }}
          path: screenshots/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: VocalInk-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Vocal Ink ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          generate_release_notes: true
          draft: false
